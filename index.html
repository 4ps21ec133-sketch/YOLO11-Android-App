
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YOLO11 Object Detection</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 { font-size: 24px; }

    .subtitle, .note {
      color: #c6d1dc;
      font-size: 14px;
      line-height: 1.6;
    }

    .viewer {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 16px auto;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: black;
      border: 2px solid #3c5368;
      border-radius: 12px;
    }

    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    canvas { pointer-events: none; }

    #status, #modelStatus {
      max-width: 640px;
      margin: 12px auto;
      padding: 12px;
      background: #243447;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    button {
      padding: 12px 20px;
      margin: 8px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: #20c878;
      color: #061c12;
    }

    #stopButton {
      background: #e35d6a;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    details {
      max-width: 640px;
      margin: 16px auto;
      padding: 12px;
      text-align: left;
      background: #1b2836;
      border-radius: 8px;
    }

    summary { cursor: pointer; font-weight: bold; }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
      color: #b9f6ca;
    }

    .note { max-width: 640px; margin: 16px auto; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "@ultralytics/yolo": "https://esm.sh/@ultralytics/yolo",
      "@litertjs/core": "https://esm.sh/@litertjs/core",
      "@litertjs/wasm-utils": "https://esm.sh/@litertjs/wasm-utils"
    }
  }
  </script>
</head>

<body>
  <h1>YOLO11 Object Detection</h1>

  <div class="subtitle">
    Tree and general object detection
  </div>

  <div class="viewer">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="status">Press Start Detection to begin.</div>
  <div id="modelStatus">Models not loaded.</div>

  <button id="startButton">Start Detection</button>
  <button id="stopButton" disabled>Stop Camera</button>

  <details>
    <summary>Detection Diagnostics</summary>
    <pre id="debug">Waiting for models.</pre>
  </details>

  <div class="note">
    Place index.html, best.onnx and yolo11n.tflite
    in the same repository folder.
  </div>

  <script type="module">
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusBox = document.getElementById("status");
    const modelStatus = document.getElementById("modelStatus");
    const debugBox = document.getElementById("debug");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");

    const MODEL_FILES = {
      tree: "./best.onnx",
      general: "./yolo11n.tflite"
    };

    const TREE_CONFIDENCE = 0.25;
    const GENERAL_CONFIDENCE = 0.25;
    const IOU = 0.70;
    const DETECTION_INTERVAL = 100;

    let YOLO;
    let treeModel = null;
    let generalModel = null;
    let cameraStream = null;
    let running = false;
    let detecting = false;
    let loading = false;
    let timer = null;
    let requestId = 0;
    let lastDetectionTime = 0;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function setDebug(message) {
      debugBox.textContent = message;
    }

    function updateModelStatus() {
      modelStatus.textContent =
        "Tree model: " + (treeModel ? "LOADED" : "NOT LOADED") + "\n" +
        "General model: " +
        (generalModel ? "LOADED" : "NOT LOADED");
    }

    function resizeCanvas() {
      if (!video.videoWidth || !video.videoHeight) return;

      if (
        canvas.width !== video.videoWidth ||
        canvas.height !== video.videoHeight
      ) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }
    }

    async function loadModels() {
      if (treeModel && generalModel) return true;
      if (loading) return false;

      loading = true;
      startButton.disabled = true;

      try {
        if (!YOLO) {
          setStatus("Loading detection library...");
          const module = await import("@ultralytics/yolo");
          YOLO = module.YOLO;
        }

        if (!treeModel) {
          setStatus("Loading best.onnx...");
          treeModel = await YOLO.load(MODEL_FILES.tree, {
            device: "cpu"
          });
          updateModelStatus();
        }

        if (!generalModel) {
          setStatus("Loading yolo11n.tflite...");
          generalModel = await YOLO.load(MODEL_FILES.general, {
            device: "cpu"
          });
          updateModelStatus();
        }

        setDebug(
          "Models loaded.\n\nTree model classes:\n" +
          JSON.stringify(treeModel.names ?? "Not available", null, 2) +
          "\n\nGeneral model classes:\n" +
          JSON.stringify(generalModel.names ?? "Not available", null, 2)
        );

        return true;
      } catch (error) {
        console.error("Model loading error:", error);
        setStatus("Model loading failed:\n" + error.message);
        setDebug(error.stack || String(error));
        return false;
      } finally {
        loading = false;
        startButton.disabled = Boolean(cameraStream) || running;
      }
    }

    function drawBox(box, color) {
      const x1 = Number(box.x1);
      const y1 = Number(box.y1);
      const x2 = Number(box.x2);
      const y2 = Number(box.y2);

      if (![x1, y1, x2, y2].every(Number.isFinite)) return;

      const left = Math.max(0, Math.min(canvas.width, x1));
      const top = Math.max(0, Math.min(canvas.height, y1));
      const right = Math.max(0, Math.min(canvas.width, x2));
      const bottom = Math.max(0, Math.min(canvas.height, y2));

      if (right <= left || bottom <= top) return;

      const name = String(box.name || "Object");
      const confidence = Number(box.conf);
      const score = Number.isFinite(confidence)
        ? " " + Math.round(confidence * 100) + "%"
        : "";

      const label = name + score;

      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.strokeRect(left, top, right - left, bottom - top);

      ctx.font = "bold 15px Arial";

      const labelWidth = Math.min(
        ctx.measureText(label).width + 12,
        canvas.width - left
      );
      const labelY = Math.max(0, top - 24);

      ctx.fillStyle = color;
      ctx.fillRect(left, labelY, labelWidth, 24);

      ctx.fillStyle = "#ffffff";
      ctx.fillText(label, left + 5, labelY + 17);
    }

    function getBoxes(results) {
      return Array.isArray(results?.boxes) ? results.boxes : [];
    }

    function isTreeDetection(box) {
      const name = String(box.name || "").trim();
      const names = treeModel?.names;
      const classCount = names
        ? Object.keys(names).length
        : 0;

      return /tree/i.test(name) ||
        (classCount === 1 && Number(box.cls) === 0);
    }

    async function detectLoop() {
      if (!running || detecting) return;

      detecting = true;
      let nextDelay = DETECTION_INTERVAL;

      try {
        if (
          video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA ||
          !treeModel ||
          !generalModel
        ) {
          nextDelay = 250;
          return;
        }

        resizeCanvas();

        const [treeResults, generalResults] = await Promise.all([
          treeModel.predict(video, {
            conf: TREE_CONFIDENCE,
            iou: IOU
          }),
          generalModel.predict(video, {
            conf: GENERAL_CONFIDENCE,
            iou: IOU
          })
        ]);

        if (!running) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const treeBoxes = getBoxes(treeResults);
        const generalBoxes = getBoxes(generalResults);

        let treeCount = 0;
        let generalCount = 0;

        for (const box of treeBoxes) {
          if (isTreeDetection(box)) {
            drawBox(box, "#20c878");
            treeCount++;
          }
        }

        for (const box of generalBoxes) {
          drawBox(box, "#36a3ff");
          generalCount++;
        }

        lastDetectionTime = Date.now();

        setStatus(
          "Trees: " + treeCount +
          " | General detections: " + generalCount +
          "\nTree confidence: " + TREE_CONFIDENCE +
          " | General confidence: " + GENERAL_CONFIDENCE +
          " | IoU: " + IOU
        );

        setDebug(
          "Detection running successfully.\n\n" +
          "Tree model: " + MODEL_FILES.tree +
          "\nTree boxes returned: " + treeBoxes.length +
          "\nTree boxes drawn: " + treeCount +
          "\nGeneral boxes returned: " + generalBoxes.length +
          "\nGeneral boxes drawn: " + generalCount +
          "\n\nTree classes:\n" +
          JSON.stringify(treeModel.names ?? "Unknown", null, 2) +
          "\n\nGeneral classes:\n" +
          JSON.stringify(generalModel.names ?? "Unknown", null, 2)
        );

      } catch (error) {
        console.error("Detection error:", error);
        setStatus("Detection error: " + error.message);
        setDebug(error.stack || String(error));
        nextDelay = 500;
      } finally {
        detecting = false;

        if (running) {
          timer = setTimeout(detectLoop, nextDelay);
        }
      }
    }

    async function startCamera() {
      if (cameraStream || loading || running) return;

      const thisRequest = ++requestId;
      startButton.disabled = true;

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            "Camera access is unavailable. Open this page using HTTPS."
          );
        }

        setStatus("Requesting camera permission...");

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 640 },
            height: { ideal: 640 }
          }
        });

        if (thisRequest !== requestId) {
          stream.getTracks().forEach(track => track.stop());
          return;
        }

        cameraStream = stream;
        video.srcObject = stream;

        await video.play();

        if (thisRequest !== requestId) return;

        setStatus("Camera opened. Loading AI models...");

        const loaded = await loadModels();

        if (thisRequest !== requestId) return;

        if (!loaded) {
          // Keep the camera running so the error remains visible.
          stopButton.disabled = false;
          startButton.disabled = false;
          setStatus(
            "Camera is open, but a model failed to load. " +
            "Read Detection Diagnostics for the error."
          );
          return;
        }

        running = true;
        stopButton.disabled = false;
        startButton.disabled = true;

        setStatus("Models ready. Detecting objects...");
        detectLoop();

      } catch (error) {
        console.error("Camera start error:", error);
        setStatus("Could not start camera:\n" + error.message);
        setDebug(error.stack || String(error));

        stopCamera(false);
        startButton.disabled = false;
      }
    }

    function stopCamera(showMessage = true) {
      requestId++;
      running = false;

      if (timer !== null) {
        clearTimeout(timer);
        timer = null;
      }

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }

      video.pause();
      video.srcObject = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      stopButton.disabled = true;
      startButton.disabled = loading;

      if (showMessage) setStatus("Camera stopped.");
    }

    startButton.addEventListener("click", startCamera);
    stopButton.addEventListener("click", () => stopCamera());

    window.addEventListener("pagehide", () => {
      stopCamera(false);
    });

    updateModelStatus();
  </script>
</body>
</html>
