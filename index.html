<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOLO11 Object Detection</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #c6d1dc;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .viewer {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      overflow: hidden;
      background: #000;
      border: 2px solid #3c5368;
      border-radius: 12px;
      aspect-ratio: 3 / 4;
    }

    video,
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    video {
      transform: scaleX(-1);
    }

    canvas {
      pointer-events: none;
    }

    #status {
      margin: 14px auto;
      max-width: 640px;
      padding: 12px;
      background: #243447;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: #20c878;
      color: #061c12;
    }

    #stopButton {
      background: #e35d6a;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    details {
      max-width: 640px;
      margin: 16px auto;
      padding: 12px;
      text-align: left;
      background: #1b2836;
      border-radius: 8px;
    }

    summary {
      cursor: pointer;
      font-weight: bold;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
      color: #b9f6ca;
    }

    .note {
      max-width: 640px;
      margin: 14px auto;
      color: #c6d1dc;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "@ultralytics/yolo": "https://esm.sh/@ultralytics/yolo",
      "@litertjs/core": "https://esm.sh/@litertjs/core",
      "@litertjs/wasm-utils": "https://esm.sh/@litertjs/wasm-utils"
    }
  }
  </script>
</head>

<body>
  <h1>YOLO11 Object Detection</h1>
  <div class="subtitle">
    Real-time object detection using your camera
  </div>

  <div class="viewer">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="status">
    Press Start Camera to begin.
  </div>

  <div class="buttons">
    <button id="startButton">Start Camera</button>
    <button id="stopButton" disabled>Stop Camera</button>
  </div>

  <details open>
    <summary>Detection Diagnostics</summary>
    <pre id="debug">Model not loaded yet.</pre>
  </details>

  <div class="note">
    Allow camera permission when asked. For best testing, show one
    clearly visible object at a time with good lighting.
  </div>

  <script type="module">
    import { YOLO, annotate } from "@ultralytics/yolo";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const statusBox = document.getElementById("status");
    const debugBox = document.getElementById("debug");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");

    const MODEL_PATH = "./yolo11n.tflite";
    const CONFIDENCE = 0.10;
    const IOU = 0.70;

    let model = null;
    let cameraStream = null;
    let running = false;
    let detecting = false;
    let modelLoading = false;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function setDebug(message) {
      debugBox.textContent = message;
    }

    function clearCanvas() {
      const context = canvas.getContext("2d");
      context.clearRect(0, 0, canvas.width, canvas.height);
    }

    function updateCanvasSize() {
      const width = video.videoWidth;
      const height = video.videoHeight;

      if (width > 0 && height > 0) {
        canvas.width = width;
        canvas.height = height;
      }
    }

    async function loadModel() {
      if (model) {
        return model;
      }

      if (modelLoading) {
        throw new Error("The model is already loading. Please wait.");
      }

      modelLoading = true;
      setStatus("Loading YOLO11 model on CPU. Please wait...");
      setDebug("Loading model file: " + MODEL_PATH);

      try {
        model = await Promise.race([
          YOLO.load(MODEL_PATH, {
            device: "cpu"
          }),
          new Promise((_, reject) => {
            setTimeout(() => {
              reject(
                new Error(
                  "Model loading took too long. Check the model file and internet connection."
                )
              );
            }, 60000);
          })
        ]);

        setDebug(
          "Model loaded successfully.\n" +
          "Model file: " + MODEL_PATH + "\n" +
          "Requested device: cpu\n" +
          "Reported device: " + (model.device ?? "unknown")
        );

        return model;
      } finally {
        modelLoading = false;
      }
    }

    async function startCamera() {
      if (running) {
        return;
      }

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        setStatus(
          "Camera access is unavailable. Open this page in Chrome using HTTPS."
        );
        return;
      }

      startButton.disabled = true;

      try {
        setStatus("Requesting camera permission...");

        cameraStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "environment",
            width: { ideal: 640 },
            height: { ideal: 640 }
          }
        });

        video.srcObject = cameraStream;
        await video.play();

        updateCanvasSize();

        setStatus("Camera started. Loading YOLO11 model...");

        await loadModel();

        running = true;
        stopButton.disabled = false;
        startButton.disabled = true;

        setStatus("YOLO11 is detecting objects on CPU...");
        detectLoop();
      } catch (error) {
        console.error(error);

        stopCamera();

        setStatus("Could not start: " + error.message);
        setDebug(
          "Error:\n" + (error.stack || error.message) +
          "\n\nCheck that yolo11n.tflite exists beside index.html."
        );

        startButton.disabled = false;
      }
    }

    async function detectLoop() {
      if (!running || detecting || !model) {
        return;
      }

      detecting = true;

      try {
        if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
          return;
        }

        updateCanvasSize();

        const results = await model.predict(video, {
          conf: CONFIDENCE,
          iou: IOU
        });

        if (!running) {
          return;
        }

        const boxes = Array.isArray(results?.boxes)
          ? results.boxes
          : [];

        // Draw the video and detection boxes using the library helper.
        await annotate(canvas, video, results);

        if (boxes.length > 0) {
          setStatus(
            "Objects detected: " + boxes.length
          );
        } else {
          setStatus("No objects detected in this frame.");
        }

        setDebug(
          "Task: " + (results?.task ?? "not reported") + "\n" +
          "Input size: " +
            (results?.width ?? "?") + " x " +
            (results?.height ?? "?") + "\n" +
          "Boxes returned: " + boxes.length + "\n" +
          "Model device: " + (model?.device ?? "unknown") + "\n" +
          "Confidence threshold: " + CONFIDENCE + "\n" +
          "IoU threshold: " + IOU + "\n\n" +
          "Inference details:\n" +
          JSON.stringify(boxes, null, 2)
        );
      } catch (error) {
        console.error("Detection error:", error);

        setStatus("Detection error: " + error.message);
        setDebug(
          "Detection failed.\n" +
          (error.stack || error.message)
        );
      } finally {
        detecting = false;

        if (running) {
          // Avoid running another inference before the previous one finishes.
          setTimeout(detectLoop, 50);
        }
      }
    }

    function stopCamera() {
      running = false;

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }

      video.pause();
      video.srcObject = null;
      clearCanvas();

      stopButton.disabled = true;
      startButton.disabled = false;

      setStatus("Camera stopped.");
    }

    startButton.addEventListener("click", startCamera);
    stopButton.addEventListener("click", stopCamera);

    window.addEventListener("pagehide", stopCamera);
  </script>
</body>
</html>
