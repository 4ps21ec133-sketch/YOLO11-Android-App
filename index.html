<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOLO11 Object Detection</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 { font-size: 25px; }

    .subtitle, .note {
      color: #c6d1dc;
      font-size: 14px;
      line-height: 1.6;
    }

    .viewer {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 16px auto;
      overflow: hidden;
      background: #000;
      border: 2px solid #3c5368;
      border-radius: 12px;
      aspect-ratio: 3 / 4;
    }

    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    canvas { pointer-events: none; }

    #status, #modelStatus {
      max-width: 640px;
      margin: 12px auto;
      padding: 12px;
      background: #243447;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .controls {
      max-width: 640px;
      margin: 14px auto;
    }

    select, button {
      padding: 12px;
      border: 0;
      border-radius: 8px;
      font-size: 15px;
      margin: 5px;
    }

    select {
      width: 100%;
      background: white;
      color: #101820;
    }

    button {
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: #20c878;
      color: #061c12;
    }

    #stopButton {
      background: #e35d6a;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    details {
      max-width: 640px;
      margin: 16px auto;
      padding: 12px;
      text-align: left;
      background: #1b2836;
      border-radius: 8px;
    }

    summary { cursor: pointer; font-weight: bold; }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
      color: #b9f6ca;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "@ultralytics/yolo": "https://esm.sh/@ultralytics/yolo",
      "@litertjs/core": "https://esm.sh/@litertjs/core",
      "@litertjs/wasm-utils": "https://esm.sh/@litertjs/wasm-utils"
    }
  }
  </script>
</head>

<body>
  <h1>YOLO11 Object Detection</h1>

  <div class="subtitle">
    Camera-based object detection using your available models
  </div>

  <div class="controls">
    <label for="modelSelect">Choose detection model:</label>
    <select id="modelSelect">
      <option value="tflite">Original model — yolo11n.tflite</option>
      <option value="onnx">Custom model — best.onnx</option>
    </select>
  </div>

  <div class="viewer">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="status">Press Start Camera to begin.</div>
  <div id="modelStatus">Models have not been loaded yet.</div>

  <div class="controls">
    <button id="startButton">Start Camera & Load Models</button>
    <button id="stopButton" disabled>Stop Camera</button>
  </div>

  <details open>
    <summary>Detection Diagnostics</summary>
    <pre id="debug">Waiting for model loading.</pre>
  </details>

  <div class="note">
    Both model files must be in the same folder as index.html.
    The selected model is used for detection.
  </div>

  <script type="module">
    import { YOLO, annotate } from "@ultralytics/yolo";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const statusBox = document.getElementById("status");
    const modelStatus = document.getElementById("modelStatus");
    const debugBox = document.getElementById("debug");
    const modelSelect = document.getElementById("modelSelect");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");

    const MODEL_FILES = {
      tflite: "./yolo11n.tflite",
      onnx: "./best.onnx"
    };

    const CONFIDENCE = 0.25;
    const IOU = 0.70;

    const models = {
      tflite: null,
      onnx: null
    };

    const modelErrors = {
      tflite: null,
      onnx: null
    };

    let cameraStream = null;
    let running = false;
    let detecting = false;
    let loading = false;
    let loopTimer = null;
    let requestId = 0;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function setDebug(message) {
      debugBox.textContent = message;
    }

    function selectedKey() {
      return modelSelect.value;
    }

    function selectedModel() {
      return models[selectedKey()];
    }

    function updateModelStatus() {
      const lines = Object.keys(MODEL_FILES).map(key => {
        const name = MODEL_FILES[key];

        if (models[key]) {
          return name + ": LOADED";
        }

        if (modelErrors[key]) {
          return name + ": FAILED — " + modelErrors[key];
        }

        return name + ": NOT LOADED";
      });

      modelStatus.textContent = lines.join("\n");
    }

    function updateCanvasSize() {
      if (!video.videoWidth || !video.videoHeight) return;

      if (
        canvas.width !== video.videoWidth ||
        canvas.height !== video.videoHeight
      ) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }
    }

    function clearCanvas() {
      canvas.getContext("2d").clearRect(
        0, 0, canvas.width, canvas.height
      );
    }

    async function loadOneModel(key) {
      if (models[key]) return models[key];

      try {
        setStatus("Loading " + MODEL_FILES[key] + "...");

        const loadedModel = await YOLO.load(MODEL_FILES[key], {
          device: "cpu"
        });

        models[key] = loadedModel;
        modelErrors[key] = null;
        updateModelStatus();

        return loadedModel;
      } catch (error) {
        modelErrors[key] = error.message || String(error);
        updateModelStatus();
        console.error("Model loading failed:", key, error);
        return null;
      }
    }

    async function loadAllModels() {
      if (loading) return;

      loading = true;
      startButton.disabled = true;

      try {
        // Load sequentially to reduce peak memory use.
        await loadOneModel("tflite");
        await loadOneModel("onnx");

        updateModelStatus();

        const loadedCount = Object.values(models).filter(Boolean).length;

        if (loadedCount === 0) {
          throw new Error(
            "Neither model loaded. Check the files and browser console."
          );
        }

        setDebug(
          "Model loading report\n\n" +
          "TFLite file: " + MODEL_FILES.tflite + "\n" +
          "TFLite loaded: " + Boolean(models.tflite) + "\n" +
          "TFLite classes:\n" +
          JSON.stringify(models.tflite?.names ?? "Not exposed", null, 2) +
          "\n\nONNX file: " + MODEL_FILES.onnx + "\n" +
          "ONNX loaded: " + Boolean(models.onnx) + "\n" +
          "ONNX classes:\n" +
          JSON.stringify(models.onnx?.names ?? "Not exposed", null, 2)
        );

        if (!selectedModel()) {
          modelSelect.value = models.tflite ? "tflite" : "onnx";
        }

        if (cameraStream) {
          running = true;
          stopButton.disabled = false;
          startButton.disabled = true;
          setStatus("Models loaded. Detecting with " + MODEL_FILES[selectedKey()]);
          detectLoop();
        } else {
          setStatus(
            loadedCount + " of 2 models loaded. Start the camera to detect."
          );
          startButton.disabled = false;
        }
      } catch (error) {
        setStatus("Loading error: " + error.message);
        setDebug(error.stack || error.message);
        startButton.disabled = false;
      } finally {
        loading = false;
      }
    }

    async function startCamera() {
      if (cameraStream || loading) return;

      const thisRequest = ++requestId;
      startButton.disabled = true;

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("Open this website using HTTPS in Chrome.");
        }

        setStatus("Requesting camera permission...");

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 640 },
            height: { ideal: 640 }
          }
        });

        if (thisRequest !== requestId) {
          stream.getTracks().forEach(track => track.stop());
          return;
        }

        cameraStream = stream;
        video.srcObject = stream;
        await video.play();
        updateCanvasSize();

        await loadAllModels();
      } catch (error) {
        console.error(error);
        stopCamera(false);
        setStatus("Could not start: " + error.message);
        setDebug(error.stack || error.message);
        startButton.disabled = false;
      }
    }

    async function detectLoop() {
      if (!running || detecting) return;

      detecting = true;

      try {
        const key = selectedKey();
        const model = selectedModel();

        if (!model) {
          setStatus(
            MODEL_FILES[key] + " did not load. Choose the other model."
          );
          setDebug(
            "Selected model failed to load.\n" +
            String(modelErrors[key] || "Unknown error")
          );
          return;
        }

        if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
          return;
        }

        updateCanvasSize();

        const results = await model.predict(video, {
          conf: CONFIDENCE,
          iou: IOU
        });

        if (!running) return;

        await annotate(canvas, video, results);

        if (!running) return;

        const boxes = Array.isArray(results?.boxes) ? results.boxes : [];

        setStatus(
          boxes.length
            ? MODEL_FILES[key] + " — detections: " + boxes.length
            : MODEL_FILES[key] + " — no objects detected in this frame."
        );

        setDebug(
          "Selected model: " + MODEL_FILES[key] + "\n" +
          "Device: " + (model.device ?? "unknown") + "\n" +
          "Task: " + (results?.task ?? "not reported") + "\n" +
          "Detection count: " + boxes.length + "\n" +
          "Confidence threshold: " + CONFIDENCE + "\n\n" +
          "Model class information:\n" +
          JSON.stringify(model.names ?? "Not exposed", null, 2) +
          "\n\nDetection results:\n" +
          JSON.stringify(boxes, null, 2)
        );
      } catch (error) {
        console.error("Detection error:", error);
        setStatus("Detection error: " + error.message);
        setDebug(error.stack || error.message);
      } finally {
        detecting = false;

        if (running) {
          loopTimer = setTimeout(detectLoop, 50);
        }
      }
    }

    modelSelect.addEventListener("change", () => {
      clearCanvas();

      if (running) {
        setStatus("Switching to " + MODEL_FILES[selectedKey()] + "...");
      }
    });

    function stopCamera(showMessage = true) {
      requestId++;
      running = false;

      if (loopTimer !== null) {
        clearTimeout(loopTimer);
        loopTimer = null;
      }

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }

      video.pause();
      video.srcObject = null;
      clearCanvas();

      stopButton.disabled = true;
      startButton.disabled = loading;

      if (showMessage) {
        setStatus("Camera stopped. Loaded models remain available.");
      }
    }

    startButton.addEventListener("click", startCamera);
    stopButton.addEventListener("click", () => stopCamera());
    window.addEventListener("pagehide", () => stopCamera(false));
  </script>
</body>
</html>
