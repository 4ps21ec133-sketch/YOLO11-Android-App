<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>YOLO11 Live Object Detection</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin: 18px 0;
    }

    p {
      font-size: 17px;
    }

    #status {
      margin: 16px 0;
      padding: 14px;
      background: #263449;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    #cameraBox {
      width: 100%;
      max-width: 640px;
      margin: 16px auto;
      background: black;
      border-radius: 12px;
      overflow: hidden;
    }

    #canvas {
      display: block;
      width: 100%;
      height: auto;
      min-height: 220px;
    }

    #video {
      display: none;
    }

    button {
      padding: 14px 18px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #22c55e;
      color: #07130b;
    }

    #stopBtn {
      background: #ef4444;
      color: white;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #results {
      margin-top: 16px;
      text-align: left;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
  </style>

  <!-- Browser inference dependencies -->
  <script type="importmap">
  {
    "imports": {
      "@ultralytics/yolo": "https://esm.sh/@ultralytics/yolo",
      "@litertjs/core": "https://esm.sh/@litertjs/core",
      "@litertjs/wasm-utils": "https://esm.sh/@litertjs/wasm-utils"
    }
  }
  </script>
</head>

<body>

  <h1>YOLO11 Object Detection</h1>
  <p>Real-time camera detection</p>

  <div id="status">Ready. Press Start Camera.</div>

  <button id="startBtn">Start Camera</button>
  <button id="stopBtn">Stop Camera</button>

  <div id="cameraBox">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" width="640" height="480"></canvas>
  </div>

  <div id="results">
    Detected objects will appear here.
  </div>

  <script type="module">
    import { YOLO, annotate } from "@ultralytics/yolo";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const statusBox = document.getElementById("status");
    const resultsBox = document.getElementById("results");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    let model = null;
    let cameraStream = null;
    let cameraActive = false;
    let detecting = false;
    let busy = false;
    let sessionId = 0;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function clearCanvas() {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function stopCamera() {
      sessionId++;
      cameraActive = false;
      detecting = false;
      busy = false;

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }

      video.pause();
      video.srcObject = null;

      startBtn.disabled = false;
      clearCanvas();
      setStatus("Camera stopped.");
      resultsBox.textContent = "Detection stopped.";
    }

    stopBtn.addEventListener("click", stopCamera);

    // Show the live camera image while the model loads.
    function drawPreview() {
      if (!cameraActive) return;

      if (video.readyState >= 2) {
        ctx.drawImage(
          video, 0, 0, canvas.width, canvas.height
        );
      }

      requestAnimationFrame(drawPreview);
    }

    // Prevent model loading from waiting indefinitely.
    async function loadModelWithTimeout() {
      setStatus("Loading YOLO11 model. Please wait...");

      const timeoutId = setTimeout(() => {}, 0);
      clearTimeout(timeoutId);

      let timerId;

      try {
        return await Promise.race([
          YOLO.load("./yolo11n.tflite"),

          new Promise((_, reject) => {
            timerId = setTimeout(() => {
              reject(new Error(
                "Model loading timed out after 45 seconds. " +
                "Check the model URL and browser runtime."
              ));
            }, 45000);
          })
        ]);
      } finally {
        clearTimeout(timerId);
      }
    }

    startBtn.addEventListener("click", async () => {
      if (cameraActive) return;

      const mySession = ++sessionId;

      startBtn.disabled = true;
      resultsBox.textContent = "Preparing camera...";

      try {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error(
            "Camera access is unavailable. Open the HTTPS website in Chrome."
          );
        }

        setStatus("Requesting camera permission...");

        cameraStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 640 },
            height: { ideal: 480 }
          }
        });

        if (mySession !== sessionId) {
          cameraStream.getTracks().forEach(track => track.stop());
          cameraStream = null;
          return;
        }

        video.srcObject = cameraStream;
        await video.play();

        cameraActive = true;
        drawPreview();

        setStatus("Camera ready. Loading YOLO11 model...");

        if (!model) {
          model = await loadModelWithTimeout();
        }

        if (mySession !== sessionId || !cameraActive) return;

        setStatus("Model loaded. Starting object detection...");
        resultsBox.textContent = "Looking for objects...";

        detecting = true;
        startBtn.disabled = false;

        detectLoop(mySession);

      } catch (error) {
        console.error("YOLO11 error:", error);

        if (mySession === sessionId) {
          stopCamera();
          setStatus("ERROR: " + (error.message || String(error)));
          resultsBox.textContent =
            "Detection could not start. Check your internet connection " +
            "and browser runtime. If the problem continues, inspect " +
            "Chrome's developer console for the detailed error.";
        }
      } finally {
        if (mySession === sessionId) {
          startBtn.disabled = false;
        }
      }
    });

    async function detectLoop(mySession) {
      if (!detecting || !cameraActive ||
          mySession !== sessionId || busy) {
        return;
      }

      if (video.readyState < 2) {
        setTimeout(() => detectLoop(mySession), 200);
        return;
      }

      busy = true;

      try {
        setStatus("YOLO11 is detecting objects...");

        const results = await model.predict(video);

        if (!detecting || !cameraActive ||
            mySession !== sessionId) {
          return;
        }

        // Draw boxes and labels returned by the model.
        await annotate(canvas, video, results);

        const boxes = results && results.boxes
          ? Array.from(results.boxes)
          : [];

        if (boxes.length > 0) {
          const lines = boxes.map(box => {
            const confidence =
              (Number(box.conf) * 100).toFixed(1);

            return `${box.name || "Object"} - ${confidence}%`;
          });

          resultsBox.textContent =
            "Detected objects:\n" + lines.join("\n");
        } else {
          resultsBox.textContent =
            "No objects detected in this frame.";
        }

      } catch (error) {
        console.error("Detection error:", error);

        if (mySession === sessionId) {
          detecting = false;
          cameraActive = false;

          if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
          }

          video.srcObject = null;
          startBtn.disabled = false;

          setStatus(
            "DETECTION ERROR: " +
            (error.message || String(error))
          );

          resultsBox.textContent =
            "The model or browser inference runtime failed. " +
            "Check the error in the status above.";
        }

        return;
      } finally {
        busy = false;
      }

      if (detecting && cameraActive &&
          mySession === sessionId) {
        setTimeout(() => detectLoop(mySession), 100);
      }
    }
  </script>

</body>
</html>
