
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOLO11 Combined Object Detection</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 { font-size: 25px; }

    .subtitle, .note {
      color: #c6d1dc;
      font-size: 14px;
      line-height: 1.6;
    }

    .viewer {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 16px auto;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: #000;
      border: 2px solid #3c5368;
      border-radius: 12px;
    }

    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    canvas { pointer-events: none; }

    #status, #modelStatus {
      max-width: 640px;
      margin: 12px auto;
      padding: 12px;
      background: #243447;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    button {
      padding: 12px 20px;
      margin: 8px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: #20c878;
      color: #061c12;
    }

    #stopButton {
      background: #e35d6a;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    details {
      max-width: 640px;
      margin: 16px auto;
      padding: 12px;
      text-align: left;
      background: #1b2836;
      border-radius: 8px;
    }

    summary { cursor: pointer; font-weight: bold; }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
      color: #b9f6ca;
    }

    .note { max-width: 640px; margin: 16px auto; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "@ultralytics/yolo": "https://esm.sh/@ultralytics/yolo"
    }
  }
  </script>
</head>

<body>
  <h1>YOLO11 Object Detection</h1>

  <div class="subtitle">
    Combined tree and general object detection
  </div>

  <div class="viewer">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="status">Press Start Camera to begin.</div>
  <div id="modelStatus">Both models have not loaded yet.</div>

  <button id="startButton">Start Detection</button>
  <button id="stopButton" disabled>Stop Camera</button>

  <details>
    <summary>Detection Diagnostics</summary>
    <pre id="debug">Waiting for models...</pre>
  </details>

  <div class="note">
    Keep best.onnx, yolo11n.tflite and index.html in the same
    GitHub repository folder. Both models run automatically.
  </div>

  <script type="module">
    import { YOLO } from "@ultralytics/yolo";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusBox = document.getElementById("status");
    const modelStatus = document.getElementById("modelStatus");
    const debugBox = document.getElementById("debug");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");

    const MODEL_FILES = {
      tree: "./best.onnx",
      general: "./yolo11n.tflite"
    };

    // Custom tree model: higher threshold to reduce false positives.
    const TREE_CONFIDENCE = 0.60;

    // General model: retain a lower threshold for everyday objects.
    const GENERAL_CONFIDENCE = 0.35;
    const IOU = 0.70;

    let treeModel = null;
    let generalModel = null;
    let cameraStream = null;
    let running = false;
    let detecting = false;
    let loading = false;
    let timer = null;
    let requestId = 0;

    function status(message) {
      statusBox.textContent = message;
    }

    function debug(message) {
      debugBox.textContent = message;
    }

    function updateModelStatus() {
      modelStatus.textContent =
        "Tree model (best.onnx): " +
        (treeModel ? "LOADED" : "NOT LOADED") + "\n" +
        "General model (yolo11n.tflite): " +
        (generalModel ? "LOADED" : "NOT LOADED");
    }

    function resizeCanvas() {
      if (!video.videoWidth || !video.videoHeight) return;

      if (
        canvas.width !== video.videoWidth ||
        canvas.height !== video.videoHeight
      ) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }
    }

    async function loadModels() {
      loading = true;
      startButton.disabled = true;

      try {
        status("Loading custom tree model...");

        treeModel = await YOLO.load(MODEL_FILES.tree, {
          device: "cpu"
        });

        updateModelStatus();

        status("Loading general object model...");

        generalModel = await YOLO.load(MODEL_FILES.general, {
          device: "cpu"
        });

        updateModelStatus();

        debug(
          "Both models loaded successfully.\n\n" +
          "Tree model classes:\n" +
          JSON.stringify(treeModel.names ?? "Not exposed", null, 2) +
          "\n\nGeneral model classes:\n" +
          JSON.stringify(generalModel.names ?? "Not exposed", null, 2)
        );

        return true;
      } catch (error) {
        console.error(error);
        status("Model loading failed: " + error.message);
        debug(
          "Check both filenames and model compatibility.\n\n" +
          (error.stack || error.message)
        );
        return false;
      } finally {
        loading = false;
        startButton.disabled = Boolean(cameraStream);
      }
    }

    function drawDetection(box, color, labelPrefix = "") {
      const x1 = Number(box.x1);
      const y1 = Number(box.y1);
      const x2 = Number(box.x2);
      const y2 = Number(box.y2);

      if (![x1, y1, x2, y2].every(Number.isFinite)) return;

      const name = String(box.name ?? "Object");
      const confidence = Number(box.conf);
      const score = Number.isFinite(confidence)
        ? " " + (confidence * 100).toFixed(0) + "%"
        : "";

      const label = labelPrefix + name + score;

      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

      ctx.font = "bold 15px Arial";

      const textWidth = ctx.measureText(label).width;
      const labelHeight = 23;
      const labelY = Math.max(0, y1 - labelHeight);

      ctx.fillStyle = color;
      ctx.fillRect(
        x1,
        labelY,
        Math.min(textWidth + 12, canvas.width - x1),
        labelHeight
      );

      ctx.fillStyle = "#ffffff";
      ctx.fillText(label, x1 + 5, labelY + 16);
    }

    function getBoxes(results) {
      return Array.isArray(results?.boxes) ? results.boxes : [];
    }

    async function detectLoop() {
      if (!running || detecting) return;

      detecting = true;

      try {
        if (
          video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA ||
          !treeModel ||
          !generalModel
        ) {
          return;
        }

        resizeCanvas();

        // Run both models against the SAME camera frame.
        const [treeResults, generalResults] = await Promise.all([
          treeModel.predict(video, {
            conf: TREE_CONFIDENCE,
            iou: IOU
          }),
          generalModel.predict(video, {
            conf: GENERAL_CONFIDENCE,
            iou: IOU
          })
        ]);

        if (!running) return;

        // Clear the previous frame and draw both result sets together.
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const treeBoxes = getBoxes(treeResults);
        const generalBoxes = getBoxes(generalResults);

        let treeCount = 0;
        let generalCount = 0;
        let ignoredTreeLabels = 0;

        // Custom model: draw detections identified as Tree.
        // If the model has only one class, treat its detections as Tree.
        const classNames = treeModel.names;
        const classCount = classNames
          ? Object.keys(classNames).length
          : 0;

        for (const box of treeBoxes) {
          const name = String(box.name ?? "").trim();
          const isTree =
            /tree/i.test(name) ||
            (!name && classCount === 1) ||
            (classCount === 1 && Number(box.cls) === 0);

          if (isTree) {
            drawDetection(box, "#20c878", "");
            treeCount++;
          } else {
            ignoredTreeLabels++;
          }
        }

        // Original model: draw its general object detections.
        for (const box of generalBoxes) {
          drawDetection(box, "#36a3ff", "");
          generalCount++;
        }

        status(
          "Trees detected: " + treeCount +
          " | Other model detections: " + generalCount
        );

        debug(
          "Both models are running on one camera frame.\n\n" +
          "Tree model: " + MODEL_FILES.tree + "\n" +
          "Tree confidence threshold: " + TREE_CONFIDENCE + "\n" +
          "Tree detections drawn: " + treeCount + "\n" +
          "Non-tree custom detections ignored: " + ignoredTreeLabels +
          "\n\nGeneral model: " + MODEL_FILES.general + "\n" +
          "General confidence threshold: " + GENERAL_CONFIDENCE + "\n" +
          "General detections drawn: " + generalCount +
          "\n\nTree model classes:\n" +
          JSON.stringify(treeModel.names ?? "Not exposed", null, 2) +
          "\n\nGeneral model classes:\n" +
          JSON.stringify(generalModel.names ?? "Not exposed", null, 2)
        );

      } catch (error) {
        console.error("Detection error:", error);
        status("Detection error: " + error.message);
        debug(error.stack || error.message);
      } finally {
        detecting = false;

        if (running) {
          timer = setTimeout(detectLoop, 50);
        }
      }
    }

    async function startCamera() {
      if (cameraStream || loading || running) return;

      const thisRequest = ++requestId;
      startButton.disabled = true;

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("Open the website over HTTPS in Chrome.");
        }

        status("Opening camera...");

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 640 },
            height: { ideal: 640 }
          }
        });

        if (thisRequest !== requestId) {
          stream.getTracks().forEach(track => track.stop());
          return;
        }

        cameraStream = stream;
        video.srcObject = stream;
        await video.play();

        resizeCanvas();

        const loaded = await loadModels();

        if (!loaded || thisRequest !== requestId) {
          stopCamera(false);
          startButton.disabled = false;
          return;
        }

        running = true;
        stopButton.disabled = false;
        startButton.disabled = true;

        status("Both models ready. Detecting trees and other objects...");
        detectLoop();

      } catch (error) {
        console.error(error);
        status("Could not start: " + error.message);
        debug(error.stack || error.message);
        stopCamera(false);
        startButton.disabled = false;
      }
    }

    function stopCamera(showMessage = true) {
      requestId++;
      running = false;

      if (timer !== null) {
        clearTimeout(timer);
        timer = null;
      }

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }

      video.pause();
      video.srcObject = null;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      stopButton.disabled = true;
      startButton.disabled = loading;

      if (showMessage) status("Camera stopped.");
    }

    startButton.addEventListener("click", startCamera);
    stopButton.addEventListener("click", () => stopCamera());
    window.addEventListener("pagehide", () => stopCamera(false));
  </script>
</body>
</html>
