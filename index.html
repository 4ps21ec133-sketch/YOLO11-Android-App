<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>YOLO11 Live Object Detection</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin: 18px 0;
    }

    #status {
      margin: 16px 0;
      padding: 14px;
      background: #263449;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    #cameraBox {
      width: 100%;
      max-width: 640px;
      margin: 16px auto;
      background: black;
      border-radius: 12px;
      overflow: hidden;
    }

    #canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    #video {
      display: none;
    }

    button {
      padding: 14px 18px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    #startBtn {
      background: #22c55e;
      color: #07130b;
    }

    #stopBtn {
      background: #ef4444;
      color: white;
    }

    button:disabled {
      opacity: 0.55;
    }

    #results {
      margin-top: 16px;
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #debug {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: #1c293b;
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 13px;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "@ultralytics/yolo": "https://esm.sh/@ultralytics/yolo",
      "@litertjs/core": "https://esm.sh/@litertjs/core",
      "@litertjs/wasm-utils": "https://esm.sh/@litertjs/wasm-utils"
    }
  }
  </script>
</head>

<body>

  <h1>YOLO11 Object Detection</h1>
  <p>Real-time camera detection</p>

  <div id="status">Ready. Press Start Camera.</div>

  <button id="startBtn">Start Camera</button>
  <button id="stopBtn">Stop Camera</button>

  <div id="cameraBox">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" width="640" height="480"></canvas>
  </div>

  <div id="results">
    Detected objects will appear here.
  </div>

  <div id="debug">
    Diagnostic information will appear here.
  </div>

  <script type="module">
    import { YOLO, annotate } from "@ultralytics/yolo";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const statusBox = document.getElementById("status");
    const resultsBox = document.getElementById("results");
    const debugBox = document.getElementById("debug");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    let model = null;
    let cameraStream = null;
    let cameraActive = false;
    let detecting = false;
    let busy = false;
    let sessionId = 0;
    let previewFrameId = null;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function setDebug(message) {
      debugBox.textContent = message;
    }

    function stopPreview() {
      if (previewFrameId !== null) {
        cancelAnimationFrame(previewFrameId);
        previewFrameId = null;
      }
    }

    function drawPreview() {
      if (!cameraActive || detecting) {
        previewFrameId = null;
        return;
      }

      if (video.readyState >= 2) {
        ctx.drawImage(
          video, 0, 0, canvas.width, canvas.height
        );
      }

      previewFrameId = requestAnimationFrame(drawPreview);
    }

    function stopCamera() {
      sessionId++;

      cameraActive = false;
      detecting = false;
      busy = false;

      stopPreview();

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }

      video.pause();
      video.srcObject = null;

      startBtn.disabled = false;

      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      setStatus("Camera stopped.");
      resultsBox.textContent = "Detection stopped.";
      setDebug("Press Start Camera to run again.");
    }

    stopBtn.addEventListener("click", stopCamera);

    function loadModelWithTimeout() {
      setStatus("Loading YOLO11 model...");
      setDebug(
        "Model file: ./yolo11n.tflite\n" +
        "Please wait while the browser loads the model."
      );

      return new Promise((resolve, reject) => {
        let settled = false;

        const timer = setTimeout(() => {
          if (!settled) {
            settled = true;
            reject(new Error(
              "Model loading timed out after 45 seconds. " +
              "Check the model URL and browser runtime."
            ));
          }
        }, 45000);

        YOLO.load("./yolo11n.tflite")
          .then(loadedModel => {
            if (settled) return;

            settled = true;
            clearTimeout(timer);
            resolve(loadedModel);
          })
          .catch(error => {
            if (settled) return;

            settled = true;
            clearTimeout(timer);
            reject(error);
          });
      });
    }

    startBtn.addEventListener("click", async () => {
      if (cameraActive) return;

      const mySession = ++sessionId;

      startBtn.disabled = true;
      resultsBox.textContent = "Preparing camera...";
      setDebug("Checking camera and model...");

      try {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error(
            "Camera API unavailable. Open the HTTPS site in Chrome."
          );
        }

        setStatus("Requesting camera permission...");

        cameraStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 640 },
            height: { ideal: 480 }
          }
        });

        if (mySession !== sessionId) {
          cameraStream.getTracks().forEach(track => track.stop());
          cameraStream = null;
          return;
        }

        video.srcObject = cameraStream;
        await video.play();

        await new Promise(resolve => {
          if (video.readyState >= 2) {
            resolve();
          } else {
            video.addEventListener(
              "loadeddata", resolve, { once: true }
            );
          }
        });

        if (mySession !== sessionId) return;

        cameraActive = true;
        drawPreview();

        setStatus("Camera ready. Loading YOLO11...");

        if (!model) {
          model = await loadModelWithTimeout();
        }

        if (mySession !== sessionId || !cameraActive) return;

        // Stop preview drawing before YOLO draws detection boxes.
        stopPreview();

        detecting = true;
        setStatus("Model loaded. Starting detection...");

        setDebug(
          "Model loaded successfully.\n" +
          "Inference: starting...\n" +
          "Confidence threshold: 0.10\n" +
          "Camera resolution: " +
          video.videoWidth + " x " + video.videoHeight
        );

        resultsBox.textContent = "Looking for objects...";
        startBtn.disabled = false;

        detectLoop(mySession);

      } catch (error) {
        console.error("YOLO startup error:", error);

        if (mySession === sessionId) {
          stopCamera();

          setStatus(
            "ERROR: " + (error.message || String(error))
          );

          resultsBox.textContent =
            "Could not start detection. See the error above.";

          setDebug(
            error.stack || error.message || String(error)
          );
        }
      } finally {
        if (mySession === sessionId) {
          startBtn.disabled = false;
        }
      }
    });

    async function detectLoop(mySession) {
      if (!detecting || !cameraActive ||
          mySession !== sessionId || busy) {
        return;
      }

      if (video.readyState < 2) {
        setTimeout(() => detectLoop(mySession), 200);
        return;
      }

      busy = true;

      try {
        // Use a low confidence threshold for diagnosis.
        const results = await model.predict(video, {
          conf: 0.10,
          iou: 0.7
        });

        if (!detecting || !cameraActive ||
            mySession !== sessionId) {
          return;
        }

        const boxes = Array.isArray(results?.boxes)
          ? results.boxes
          : [];

        setDebug(
          "Task: " + (results?.task ?? "not reported") + "\n" +
          "Input size: " +
          (results?.width ?? "?") + " x " +
          (results?.height ?? "?") + "\n" +
          "Boxes returned: " + boxes.length + "\n" +
          "Model device: " + (model?.device ?? "unknown") + "\n" +
          "Inference details:\n" +
          JSON.stringify(boxes, null, 2)
        );

        // Draw the current frame and its detections together.
        await annotate(canvas, video, results);

        if (!detecting || !cameraActive ||
            mySession !== sessionId) {
          return;
        }

        if (boxes.length > 0) {
          const lines = boxes.map(box => {
            const confidence =
              (Number(box.conf) * 100).toFixed(1);

            return (
              (box.name || "Object") +
              " - " + confidence + "%"
            );
          });

          resultsBox.textContent =
            "Detected objects:\n" + lines.join("\n");
        } else {
          resultsBox.textContent =
            "No objects detected in this frame.";
        }

        setStatus("YOLO11 is detecting objects...");

      } catch (error) {
        console.error("YOLO prediction error:", error);

        if (mySession === sessionId) {
          detecting = false;
          cameraActive = false;
          stopPreview();

          if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
          }

          video.pause();
          video.srcObject = null;
          startBtn.disabled = false;

          setStatus(
            "DETECTION ERROR: " +
            (error.message || String(error))
          );

          resultsBox.textContent =
            "Prediction failed. Read the diagnostic error below.";

          setDebug(
            error.stack || error.message || String(error)
          );
        }

        return;
      } finally {
        busy = false;
      }

      if (detecting && cameraActive &&
          mySession === sessionId) {
        setTimeout(() => detectLoop(mySession), 150);
      }
    }
  </script>

</body>
</html>
