<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autonomous Robot Object Detection</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  background: #101820;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 { font-size: 24px; }

.subtitle, .note {
  color: #c6d1dc;
  font-size: 14px;
  line-height: 1.6;
}

.viewer {
  position: relative;
  width: 100%;
  max-width: 640px;
  margin: 16px auto;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  background: black;
  border: 2px solid #3c5368;
  border-radius: 12px;
}

video, canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

canvas { pointer-events: none; }

#status, #modelStatus, #debug {
  max-width: 640px;
  margin: 12px auto;
  padding: 12px;
  background: #243447;
  border-radius: 8px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

button {
  padding: 12px 20px;
  margin: 8px;
  border: 0;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#startButton {
  background: #20c878;
  color: #061c12;
}

#stopButton {
  background: #e35d6a;
  color: white;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

details {
  max-width: 640px;
  margin: 16px auto;
  padding: 12px;
  text-align: left;
  background: #1b2836;
  border-radius: 8px;
}

summary { cursor: pointer; font-weight: bold; }

.note { max-width: 640px; margin: 16px auto; }
</style>

<script type="importmap">
{
  "imports": {
    "@ultralytics/yolo": "https://esm.sh/@ultralytics/yolo",
    "@litertjs/core": "https://esm.sh/@litertjs/core",
    "@litertjs/wasm-utils": "https://esm.sh/@litertjs/wasm-utils"
  }
}
</script>
</head>

<body>
<h1>Autonomous Robot Detection</h1>

<div class="subtitle">
  General objects + trees + optional trained rock model
</div>

<div class="viewer">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<div id="status">Press Start Detection.</div>
<div id="modelStatus">Models not loaded.</div>

<button id="startButton">Start Detection</button>
<button id="stopButton" disabled>Stop Camera</button>

<details>
  <summary>Detection Diagnostics</summary>
  <pre id="debug">Waiting for models.</pre>
</details>

<div class="note">
  Keep index.html, yolo11n.tflite and tree.onnx in this folder.
  Add rock.onnx when you have a model trained on rocks and stones.
</div>

<script type="module">
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusBox = document.getElementById("status");
const modelStatus = document.getElementById("modelStatus");
const debugBox = document.getElementById("debug");
const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");

// Filenames must match the files in your GitHub repository.
const MODEL_FILES = {
  general: "./yolo11n.tflite",
  tree: "./tree.onnx",
  rock: "./rock.onnx"
};

const CONFIDENCE = 0.30;
const IOU = 0.70;
const INTERVAL = 150;

let YOLO = null;
let models = {};
let stream = null;
let running = false;
let detecting = false;
let loading = false;
let timer = null;
let requestId = 0;

function setStatus(text) {
  statusBox.textContent = text;
}

function setDebug(text) {
  debugBox.textContent = text;
}

function updateModelStatus() {
  modelStatus.textContent = Object.keys(MODEL_FILES)
    .map(key => key + " model: " +
      (models[key] ? "LOADED" : "NOT LOADED"))
    .join("\n");
}

function resizeCanvas() {
  if (!video.videoWidth || !video.videoHeight) return;
  if (canvas.width !== video.videoWidth ||
      canvas.height !== video.videoHeight) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }
}

async function loadModels() {
  if (loading) return false;
  loading = true;

  try {
    setStatus("Loading AI library...");
    const module = await import("@ultralytics/yolo");
    YOLO = module.YOLO;

    if (!YOLO) throw new Error("YOLO library export not found.");

    const errors = [];

    for (const key of Object.keys(MODEL_FILES)) {
      if (models[key]) continue;

      setStatus("Loading " + key + " model: " + MODEL_FILES[key]);

      try {
        models[key] = await YOLO.load(MODEL_FILES[key], {
          device: "cpu"
        });
      } catch (error) {
        errors.push(key + ": " + error.message);
      }

      updateModelStatus();
    }

    const loaded = Object.keys(models);
    const descriptions = loaded.map(key =>
      key + " classes:\n" +
      JSON.stringify(models[key].names ?? "Unknown", null, 2)
    );

    setDebug(
      "Loaded models:\n" + (loaded.join(", ") || "None") +
      "\n\n" + descriptions.join("\n\n") +
      "\n\nErrors:\n" + (errors.join("\n") || "None")
    );

    if (!models.general && !models.tree && !models.rock) {
      throw new Error("No models loaded. See Diagnostics.");
    }

    if (!models.rock) {
      setStatus(
        "Warning: rock model not loaded. General and tree " +
        "detection can run, but rock detection is unavailable."
      );
    }

    return true;
  } finally {
    loading = false;
    updateModelStatus();
  }
}

function drawBox(box, color, modelName) {
  const x1 = Number(box.x1);
  const y1 = Number(box.y1);
  const x2 = Number(box.x2);
  const y2 = Number(box.y2);

  if (![x1, y1, x2, y2].every(Number.isFinite)) return;

  const left = Math.max(0, Math.min(canvas.width, x1));
  const top = Math.max(0, Math.min(canvas.height, y1));
  const right = Math.max(0, Math.min(canvas.width, x2));
  const bottom = Math.max(0, Math.min(canvas.height, y2));

  if (right <= left || bottom <= top) return;

  const name = String(box.name || "Object");
  const conf = Number(box.conf);
  const score = Number.isFinite(conf)
    ? " " + Math.round(conf * 100) + "%"
    : "";

  const label = modelName + ": " + name + score;

  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.strokeRect(left, top, right - left, bottom - top);

  ctx.font = "bold 14px Arial";
  const labelWidth = Math.min(
    ctx.measureText(label).width + 10,
    canvas.width - left
  );
  const labelY = Math.max(0, top - 23);

  ctx.fillStyle = color;
  ctx.fillRect(left, labelY, labelWidth, 23);
  ctx.fillStyle = "#ffffff";
  ctx.fillText(label, left + 5, labelY + 16);
}

function getBoxes(results) {
  return Array.isArray(results?.boxes) ? results.boxes : [];
}

async function detectLoop() {
  if (!running || detecting) return;
  detecting = true;
  let delay = INTERVAL;

  try {
    if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
      delay = 250;
      return;
    }

    resizeCanvas();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const counts = {};
    const diagnostics = [];

    // Run models one at a time to reduce memory use on phones.
    const colors = {
      general: "#36a3ff",
      tree: "#20c878",
      rock: "#ffb020"
    };

    for (const key of ["general", "tree", "rock"]) {
      const model = models[key];
      if (!model) continue;

      try {
        const results = await model.predict(video, {
          conf: CONFIDENCE,
          iou: IOU
        });

        if (!running) return;

        const boxes = getBoxes(results);
        counts[key] = boxes.length;

        for (const box of boxes) {
          drawBox(box, colors[key], key.toUpperCase());
        }

        diagnostics.push(
          key + ": " + boxes.length + " detections; classes = " +
          JSON.stringify(model.names ?? "unknown")
        );
      } catch (error) {
        diagnostics.push(key + " prediction error: " + error.message);
      }
    }

    setStatus(
      "General objects: " + (counts.general ?? 0) +
      " | Trees: " + (counts.tree ?? 0) +
      " | Rocks: " + (counts.rock ?? 0) +
      (models.rock ? "" : "\nRock model not loaded.")
    );

    setDebug(diagnostics.join("\n\n"));
  } catch (error) {
    setStatus("Detection error: " + error.message);
    setDebug(error.stack || String(error));
    delay = 500;
  } finally {
    detecting = false;
    if (running) timer = setTimeout(detectLoop, delay);
  }
}

async function startCamera() {
  if (stream || loading || running) return;

  const id = ++requestId;
  startButton.disabled = true;

  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Open this page using HTTPS to access the camera.");
    }

    setStatus("Requesting camera permission...");

    const newStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 640 },
        height: { ideal: 640 }
      }
    });

    if (id !== requestId) {
      newStream.getTracks().forEach(track => track.stop());
      return;
    }

    stream = newStream;
    video.srcObject = stream;
    await video.play();

    if (id !== requestId) return;

    setStatus("Camera ready. Loading models...");

    let loaded;
    try {
      loaded = await loadModels();
    } catch (error) {
      setDebug(error.stack || String(error));
      throw error;
    }

    if (id !== requestId) return;
    if (!loaded) throw new Error("No models loaded.");

    running = true;
    stopButton.disabled = false;
    startButton.disabled = true;

    detectLoop();
  } catch (error) {
    setStatus("Startup error: " + error.message);
    if (id === requestId) stopCamera(false);
    startButton.disabled = false;
  }
}

function stopCamera(showMessage = true) {
  requestId++;
  running = false;

  if (timer !== null) {
    clearTimeout(timer);
    timer = null;
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.pause();
  video.srcObject = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  stopButton.disabled = true;
  startButton.disabled = loading;

  if (showMessage) setStatus("Camera stopped.");
}

startButton.addEventListener("click", startCamera);
stopButton.addEventListener("click", () => stopCamera());
window.addEventListener("pagehide", () => stopCamera(false));

updateModelStatus();
</script>
</body>
</html>
