
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOLO11 Object Detection</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #c6d1dc;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .viewer {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      overflow: hidden;
      background: #000;
      border: 2px solid #3c5368;
      border-radius: 12px;
      aspect-ratio: 3 / 4;
    }

    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    canvas { pointer-events: none; }

    #status {
      margin: 14px auto;
      max-width: 640px;
      padding: 12px;
      background: #243447;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: #20c878;
      color: #061c12;
    }

    #stopButton {
      background: #e35d6a;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    details {
      max-width: 640px;
      margin: 16px auto;
      padding: 12px;
      text-align: left;
      background: #1b2836;
      border-radius: 8px;
    }

    summary {
      cursor: pointer;
      font-weight: bold;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
      color: #b9f6ca;
    }

    .note {
      max-width: 640px;
      margin: 14px auto;
      color: #c6d1dc;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "@ultralytics/yolo": "https://esm.sh/@ultralytics/yolo"
    }
  }
  </script>
</head>

<body>
  <h1>YOLO11 Object Detection</h1>

  <div class="subtitle">
    Real-time detection using your custom YOLO model
  </div>

  <div class="viewer">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="status">Press Start Camera to begin.</div>

  <div class="buttons">
    <button id="startButton">Start Camera</button>
    <button id="stopButton" disabled>Stop Camera</button>
  </div>

  <details open>
    <summary>Detection Diagnostics</summary>
    <pre id="debug">Model not loaded yet.</pre>
  </details>

  <div class="note">
    Allow camera permission when asked.
    Keep best.onnx in the same folder as index.html.
    The model determines which classes can be detected.
  </div>

  <script type="module">
    import { YOLO, annotate } from "@ultralytics/yolo";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const statusBox = document.getElementById("status");
    const debugBox = document.getElementById("debug");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");

    // Custom ONNX model
    const MODEL_PATH = "./best.onnx?v=2";

    const CONFIDENCE = 0.25;
    const IOU = 0.70;

    let model = null;
    let cameraStream = null;
    let running = false;
    let detecting = false;
    let modelLoading = false;
    let loopTimer = null;
    let startRequest = 0;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function setDebug(message) {
      debugBox.textContent = message;
    }

    function clearCanvas() {
      const context = canvas.getContext("2d");
      context.clearRect(0, 0, canvas.width, canvas.height);
    }

    function updateCanvasSize() {
      if (video.videoWidth && video.videoHeight) {
        if (
          canvas.width !== video.videoWidth ||
          canvas.height !== video.videoHeight
        ) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }
      }
    }

    async function loadModel() {
      if (model) return model;

      if (modelLoading) {
        throw new Error("Model is already loading. Please wait.");
      }

      modelLoading = true;
      setStatus("Loading best.onnx...");
      setDebug("Loading model:\n" + MODEL_PATH);

      try {
        model = await YOLO.load(MODEL_PATH, {
          device: "cpu"
        });

        setDebug(
          "MODEL LOADED\n\n" +
          "File: " + MODEL_PATH + "\n" +
          "Device: " + (model.device ?? "unknown") + "\n" +
          "Confidence: " + CONFIDENCE + "\n" +
          "IoU: " + IOU + "\n\n" +
          "Model class information:\n" +
          JSON.stringify(
            model.names ?? model.metadata ?? "Class names not exposed by this library",
            null,
            2
          )
        );

        return model;
      } catch (error) {
        model = null;
        throw new Error(
          "Failed to load best.onnx. Check the model file, internet " +
          "connection and model compatibility.\n" + error.message
        );
      } finally {
        modelLoading = false;
      }
    }

    async function startCamera() {
      if (running || cameraStream || modelLoading) return;

      const requestId = ++startRequest;
      startButton.disabled = true;

      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus("Camera unavailable. Open the website over HTTPS.");
        startButton.disabled = false;
        return;
      }

      try {
        setStatus("Opening camera...");

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 640 },
            height: { ideal: 640 }
          }
        });

        if (requestId !== startRequest) {
          stream.getTracks().forEach(track => track.stop());
          return;
        }

        cameraStream = stream;
        video.srcObject = stream;

        await video.play();
        updateCanvasSize();

        setStatus("Camera ready. Loading model...");
        await loadModel();

        if (requestId !== startRequest) return;

        running = true;
        startButton.disabled = true;
        stopButton.disabled = false;

        setStatus("Model loaded. Detecting objects...");
        detectLoop();

      } catch (error) {
        console.error(error);
        stopCamera(false);
        setStatus("Error: " + error.message);
        setDebug(
          "ERROR\n\n" +
          (error.stack || error.message) +
          "\n\nCheck that best.onnx exists beside index.html."
        );
        startButton.disabled = false;
      }
    }

    async function detectLoop() {
      if (!running || detecting || !model) return;

      detecting = true;

      try {
        if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
          return;
        }

        updateCanvasSize();

        const results = await model.predict(video, {
          conf: CONFIDENCE,
          iou: IOU
        });

        if (!running) return;

        await annotate(canvas, video, results);

        if (!running) return;

        const boxes = Array.isArray(results?.boxes)
          ? results.boxes
          : [];

        setStatus(
          boxes.length > 0
            ? "Objects detected: " + boxes.length
            : "No objects detected in this frame."
        );

        setDebug(
          "MODEL: " + MODEL_PATH + "\n" +
          "Task: " + (results?.task ?? "not reported") + "\n" +
          "Device: " + (model?.device ?? "unknown") + "\n" +
          "Frame: " +
            (results?.width ?? "?") + " x " +
            (results?.height ?? "?") + "\n" +
          "Detections: " + boxes.length + "\n" +
          "Confidence threshold: " + CONFIDENCE + "\n" +
          "IoU threshold: " + IOU + "\n\n" +
          "Model classes:\n" +
          JSON.stringify(
            model.names ?? "Not exposed by library",
            null,
            2
          ) +
          "\n\nRaw detection results:\n" +
          JSON.stringify(boxes, null, 2)
        );

      } catch (error) {
        console.error("Detection error:", error);
        setStatus("Detection error: " + error.message);
        setDebug(error.stack || error.message);
      } finally {
        detecting = false;

        if (running) {
          loopTimer = setTimeout(detectLoop, 50);
        }
      }
    }

    function stopCamera(showMessage = true) {
      startRequest++;
      running = false;

      if (loopTimer !== null) {
        clearTimeout(loopTimer);
        loopTimer = null;
      }

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }

      video.pause();
      video.srcObject = null;
      clearCanvas();

      stopButton.disabled = true;
      startButton.disabled = false;

      if (showMessage) {
        setStatus("Camera stopped.");
      }
    }

    startButton.addEventListener("click", startCamera);
    stopButton.addEventListener("click", () => stopCamera());

    window.addEventListener("pagehide", () => stopCamera(false));
  </script>
</body>
</html>
