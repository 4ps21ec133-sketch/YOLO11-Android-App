name: Build YOLO11 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          MODEL_FILE=$(find . -maxdepth 1 -type f -iname 'yolo11n*.tflite' -print -quit)
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)

          if [ -z "$MODEL_FILE" ]; then
            echo "ERROR: No yolo11n*.tflite model found in repository root."
            exit 1
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found in repository root."
            exit 1
          fi

          echo "Model found: $MODEL_FILE"
          echo "Project ZIP found: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_FILE=$(find extracted -type f -name 'settings.gradle.kts' -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find extracted -type f -name 'settings.gradle' -print -quit)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle settings file not found in ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          APP_DIR="$PROJECT_DIR/app/src/main"
          RES="$APP_DIR/res"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          mkdir -p "$APP_DIR/assets"
          mkdir -p "$RES/xml"
          mkdir -p "$RES/values"
          mkdir -p "$RES/drawable"
          mkdir -p "$RES/mipmap-anydpi"

          cp "$MODEL_FILE" "$APP_DIR/assets/yolo11n.tflite"

          # App name
          cat > "$RES/values/strings.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">YOLO11 Object Detection</string>
          </resources>
          EOF

          # App theme
          cat > "$RES/values/themes.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.YOLO11Detection" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2196F3</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          # Backup rules
          cat > "$RES/xml/backup_rules.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content />
          EOF

          cat > "$RES/xml/data_extraction_rules.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <exclude domain="root" path="." />
              </cloud-backup>
              <device-transfer>
                  <exclude domain="root" path="." />
              </device-transfer>
          </data-extraction-rules>
          EOF

          # Vector launcher icon: no external image tool required
          cat > "$RES/drawable/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path
                  android:fillColor="#1976D2"
                  android:pathData="M0,0h48v48h-48z" />
              <path
                  android:fillColor="@android:color/transparent"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="2.5"
                  android:pathData="M9,14h30v20h-30z" />
              <path
                  android:fillColor="@android:color/transparent"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="2.5"
                  android:pathData="M18,14l3,-4h6l3,4" />
              <path
                  android:fillColor="@android:color/transparent"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="2.5"
                  android:pathData="M24,19a5,5 0,1 0,0 10a5,5 0,1 0,0 -10" />
          </vector>
          EOF

          # Adaptive icon for modern Android versions
          cat > "$RES/mipmap-anydpi/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/holo_blue_dark" />
              <foreground android:drawable="@drawable/ic_launcher" />
          </adaptive-icon>
          EOF

          # Round icon reference
          cp "$RES/mipmap-anydpi/ic_launcher.xml" "$RES/mipmap-anydpi/ic_launcher_round.xml"

          echo "Project prepared successfully."
          echo "Model size:"
          ls -lh "$APP_DIR/assets/yolo11n.tflite"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated: $APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YOLO11-Android-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
