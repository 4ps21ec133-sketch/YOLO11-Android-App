
name: Build YOLO11 Android APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk.yml"
      - "*.zip"
      - "*.tflite"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find and extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android project ZIP file found in repository root."
            exit 1
          fi

          echo "Using project ZIP: $ZIP_FILE"
          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          SETTINGS_FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts inside the ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Prepare Android resources and model
        shell: bash
        run: |
          set -euo pipefail

          APP="$PROJECT_DIR/app"
          RES="$APP/src/main/res"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Android app directory not found: $APP"
            exit 1
          fi

          mkdir -p "$RES/drawable"
          mkdir -p "$RES/mipmap-anydpi-v26"
          mkdir -p "$APP/src/main/assets"

          # Create adaptive launcher icons in the API 26+ resource directory.
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" \
             "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          # Create simple vector artwork if the project does not provide it.
          if [ ! -f "$RES/drawable/ic_launcher_background.xml" ]; then
            cat > "$RES/drawable/ic_launcher_background.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#202A44"/>
          </shape>
          EOF
          fi

          if [ ! -f "$RES/drawable/ic_launcher_foreground.xml" ]; then
            cat > "$RES/drawable/ic_launcher_foreground.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M24,30 L84,30 L84,78 L24,78 Z"/>
              <path
                  android:fillColor="#202A44"
                  android:pathData="M34,40 L47,40 L47,53 L34,53 Z M61,40 L74,40 L74,53 L61,53 Z M34,60 L74,60 L74,68 L34,68 Z"/>
          </vector>
          EOF
          fi

          # Locate the model uploaded to the repository root.
          MODEL_FILE=$(find . -maxdepth 1 -type f -iname '*.tflite' | head -n 1 || true)

          if [ -n "$MODEL_FILE" ]; then
            cp "$MODEL_FILE" "$APP/src/main/assets/yolo11n.tflite"
            echo "Model copied from: $MODEL_FILE"
          else
            echo "ERROR: No .tflite model found in repository root."
            exit 1
          fi

          echo "Prepared resources and model."

      - name: Make Gradle wrapper executable
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully: $APK"
          mkdir -p output
          cp "$APK" output/YOLO11-Android-App-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOLO11-Android-App-debug
          path: output/YOLO11-Android-App-debug.apk
          if-no-files-found: error
