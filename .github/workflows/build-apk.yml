name: Build YOLO11 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Check Android SDK
        run: |
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "ERROR: Android SDK command-line tools not found."
            exit 1
          fi

          sdkmanager --version

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Find Android project and YOLO model
        shell: bash
        run: |
          set -e

          echo "Checking repository files..."

          echo "Searching for YOLO TFLite model..."
          MODEL_FILE=$(find . -maxdepth 1 -type f -iname 'yolo11n*.tflite' -print -quit)

          if [ -z "$MODEL_FILE" ]; then
            echo "ERROR: No yolo11n*.tflite file found in repository root."
            echo "Make sure yolo11n (4).tflite is committed to GitHub."
            exit 1
          fi

          echo "Found model: $MODEL_FILE"

          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP is missing from repository root."
            exit 1
          fi

          echo "Found project ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_FILE=$(find extracted -type f -name 'settings.gradle.kts' -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find extracted -type f -name 'settings.gradle' -print -quit)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts in ZIP."
            echo "Check that the ZIP contains the Android project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Android project directory: $PROJECT_DIR"

          mkdir -p "$PROJECT_DIR/app/src/main/assets"

          cp "$MODEL_FILE" "$PROJECT_DIR/app/src/main/assets/yolo11n.tflite"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Model copied successfully."
          ls -lh "$PROJECT_DIR/app/src/main/assets/yolo11n.tflite"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle assembleDebug --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully: $APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YOLO11-Android-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 7
